name: nightly

# Every night: move the cab pin to opendebate-cab's latest nightly (it
# brings cab's own engine pin along). When it changed, the move lands on
# the cab/bump branch with a pull request into nightly; CI runs on it,
# and a maintainer merges it like any other.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# never two nightly runs at once
concurrency: nightly

jobs:
  cab-bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0
      - name: Move the cab pin to its latest nightly
        id: bump
        run: |
          git submodule set-url cab https://github.com/Ukrainian-Debate-Dev-Community/opendebate-cab.git
          git submodule update --init cab
          before=$(git -C cab rev-parse HEAD)
          git -C cab fetch origin nightly
          git -C cab checkout origin/nightly
          git checkout -- .gitmodules
          after=$(git -C cab rev-parse HEAD)
          echo "short=$(git -C cab rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c cab/bump
          git add cab
          git commit -m "chore: cab at ${{ steps.bump.outputs.short }}"
          git push --force origin cab/bump
          if [ -z "$(gh pr list --head cab/bump --base nightly --state open --json number -q '.[].number')" ]; then
            gh pr create --head cab/bump --base nightly \
              --title "chore: cab at ${{ steps.bump.outputs.short }}" \
              --body "opendebate-cab's latest nightly. Check config/runtime.exs against cab/config/runtime.exs; merge when CI is green."
          else
            gh pr edit cab/bump --title "chore: cab at ${{ steps.bump.outputs.short }}"
          fi
          # pull requests opened by this token start no workflows themselves
          gh workflow run ci.yml --ref cab/bump
